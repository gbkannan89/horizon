x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"
  driver: json-file

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon
      POSTGRES_DB: horizon
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  horizon-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://horizon:horizon@postgres:5432/horizon?sslmode=disable"
      APP_ENV: "development"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  postgres-data:

networks:
  default:
    name: horizon-dev
    driver: bridge
