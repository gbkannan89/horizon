services:

  # ── FastAPI Application ───────────────────────────────────────────────────
  horizon-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: horizon-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Connect to the existing thaari-postgres container on the shared network
      DATABASE_URL: postgresql://${POSTGRES_USER:-thaari}:${POSTGRES_PASSWORD:-thaari_password}@thaari-postgres:5432/${POSTGRES_DB:-horizon_db}
    # NOT exposed externally — Caddy reaches it inside app-network
    expose:
      - "8000"
    networks:
      - app-network   # joins the shared Caddy network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

# Reference the EXTERNAL network created by security-service-management
networks:
  app-network:
    external: true
    name: app-network
