name: Dependency Review
on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/pyproject.toml'
      - '**/uv.lock'
      - '**/pubspec.yaml'

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
