name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make build
      - run: make test/unit
      - run: docker build -f deploy/docker/Dockerfile.go.base -t ghcr.io/horizon/core:${{ github.ref_name }} .
      - run: |
          echo "SBOM generation placeholder"
          # cosign or syft for SBOM generation
