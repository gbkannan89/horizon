version: '3.8'

services:
  horizon-db-local:
    image: postgres:16
    container_name: horizon-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: security_admin
      POSTGRES_PASSWORD: thaari_password
      POSTGRES_DB: horizon_db
    ports:
      - "5432:5432"
    volumes:
      - horizon-pgdata-local:/var/lib/postgresql/data

  horizon-api-local:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: horizon-api-local
    restart: unless-stopped
    depends_on:
      - horizon-db-local
    environment:
      DATABASE_URL: postgresql://security_admin:thaari_password@horizon-db-local:5432/horizon_db
      JWT_SECRET_KEY: local_secret_key_123
      JWT_REFRESH_SECRET_KEY: local_refresh_secret_key_123
    ports:
      - "8000:8000"

volumes:
  horizon-pgdata-local:
